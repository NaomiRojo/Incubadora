<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Geseven · Pago y confirmación</title>

  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
  <link
    rel="stylesheet"
    as="style"
    onload="this.rel='stylesheet'"
    href="https://fonts.googleapis.com/css2?display=swap&family=Manrope:wght@400;500;700;800&family=Noto+Sans:wght@400;500;700;900"
  />

  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body>
  <div
    class="relative flex min-h-screen w-full flex-col bg-[#f7f2e7] group/design-root overflow-x-hidden"
    style="--radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(17,19,24)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%273%27/%3e%3c/svg%3e'); font-family: Manrope, 'Noto Sans', sans-serif;"
  >
    <div class="layout-container flex h-full grow flex-col">
      <!-- HEADER -->
      <header
        class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f0f2f4] px-10 py-3 bg-white/90 backdrop-blur"
      >
        <div class="flex items-center gap-4 text-[#111318]">
          <div class="size-4">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z"
                fill="currentColor"
              ></path>
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z"
                fill="currentColor"
              ></path>
            </svg>
          </div>
          <h2
            class="text-[#111318] text-lg font-bold leading-tight tracking-[-0.015em]"
          >
            Geseven
          </h2>
        </div>
        <div class="flex flex-1 justify-end gap-8">
          <div class="flex items-center gap-9">
            <a
              class="text-[#111318] text-sm font-medium leading-normal"
              href="../publicar_un_lugar/code.html"
            >
              Publicar un lugar
            </a>
            <a
              class="text-[#111318] text-sm font-medium leading-normal"
              href="../ayuda/code.html"
            >
              Ayuda
            </a>
          </div>
          <button
            class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-[#f0f2f4] text-[#111318] gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5"
            type="button"
          >
            <div class="text-[#111318]">
              <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256">
                <path
                  d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24ZM101.63,168h52.74C149,186.34,140,202.87,128,215.89,116,202.87,107,186.34,101.63,168ZM98,152a145.72,145.72,0,0,1,0-48h60a145.72,145.72,0,0,1,0,48ZM40,128a87.61,87.61,0,0,1,3.33-24H81.79a161.79,161.79,0,0,0,0,48H43.33A87.61,87.61,0,0,1,40,128ZM154.37,88H101.63C107,69.66,116,53.13,128,40.11,140,53.13,149,69.66,154.37,88Zm19.84,16h38.46a88.15,88.15,0,0,1,0,48H174.21a161.79,161.79,0,0,0,0-48Zm32.16-16H170.94a142.39,142.39,0,0,0-20.26-45A88.37,88.37,0,0,1,206.37,88ZM105.32,43A142.39,142.39,0,0,0,85.06,88H49.63A88.37,88.37,0,0,1,105.32,43ZM49.63,168H85.06a142.39,142.39,0,0,0,20.26,45A88.37,88.37,0,0,1,49.63,168Zm101.05,45a142.39,142.39,0,0,0,20.26-45h35.43A88.37,88.37,0,0,1,150.68,213Z"
                ></path>
              </svg>
            </div>
          </button>
          <div
            class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAkaqYMjXDVOyvG6cY3hzQ0WQrQdYECxsrMHx67wSUcu7gjUXTy9y0mM3w5euPYBTB_9Wf7HbXitCS2U7VY2_S39HnXnpZQjnaYlZsRkaYvfGETNTaC7usMz4ynm6k3JSlKa0JDItl8Xt_mjZccxuV2G0vNU_26Mp9omQUcK8P7MyYbYmaybjaDs20tsSWqQ_KlXMREGUZ7-nD8Fh67FPGzTAJWigznbIKEyfSKbISRFBh-grDjxUN07Ggk9r4vi_ff23f3f1h8haCU");'
          ></div>
        </div>
      </header>

      <!-- CONTENIDO -->
      <div class="px-6 lg:px-40 flex flex-1 justify-center py-5">
        <div class="layout-content-container flex flex-col w-full max-w-[960px] py-5">
          <!-- Migas -->
          <div class="flex flex-wrap gap-2 p-4">
            <a
              class="text-[#616f89] text-base font-medium leading-normal"
              href="../untitled_screen/code.html"
            >
              Buenos Aires
            </a>
            <span class="text-[#616f89] text-base font-medium leading-normal">/</span>
            <span class="text-[#111318] text-base font-medium leading-normal">
              Salón Imperial
            </span>
          </div>

          <h1
            class="text-[#111318] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 text-left pb-1 pt-5"
          >
            Confirmar y pagar
          </h1>

          <!-- Tu viaje -->
          <h2
            class="text-[#111318] text-[20px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5"
          >
            Tu reserva
          </h2>
          <div class="flex items-center gap-4 bg-white rounded-lg shadow-sm px-4 min-h-[72px] py-3 mx-4">
            <div class="flex flex-col justify-center">
              <p
                class="text-[#111318] text-base font-medium leading-normal line-clamp-1"
              >
                Salón Imperial
              </p>
              <p class="text-[#616f89] text-sm font-normal leading-normal line-clamp-2">
                5–7 de octubre · 1 persona
              </p>
            </div>
          </div>

          <!-- Método de pago -->
          <h2
            class="text-[#111318] text-[20px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5"
          >
            Método de pago
          </h2>
          <div class="flex flex-col gap-3 p-4">
            <label
              class="flex items-center gap-4 rounded-lg border border-solid border-[#dbdfe6] bg-white p-[15px]"
            >
              <input
                type="radio"
                class="h-5 w-5 border-2 border-[#dbdfe6] bg-transparent text-transparent checked:border-[#111318] checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-[#111318]"
                name="payment-method"
                checked
              />
              <div class="flex grow flex-col">
                <p class="text-[#111318] text-sm font-medium leading-normal">
                  Tarjeta de crédito / débito
                </p>
              </div>
            </label>
            <label
              class="flex items-center gap-4 rounded-lg border border-solid border-[#dbdfe6] bg-white p-[15px]"
            >
              <input
                type="radio"
                class="h-5 w-5 border-2 border-[#dbdfe6] bg-transparent text-transparent checked:border-[#111318] checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-[#111318]"
                name="payment-method"
              />
              <div class="flex grow flex-col">
                <p class="text-[#111318] text-sm font-medium leading-normal">
                  Transferencia / depósito
                </p>
              </div>
            </label>
            <label
              class="flex items-center gap-4 rounded-lg border border-solid border-[#dbdfe6] bg-white p-[15px]"
            >
              <input
                type="radio"
                class="h-5 w-5 border-2 border-[#dbdfe6] bg-transparent text-transparent checked:border-[#111318] checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0 checked:focus:border-[#111318]"
                name="payment-method"
              />
              <div class="flex grow flex-col">
                <p class="text-[#111318] text-sm font-medium leading-normal">
                  Pago en efectivo (acuerdo con el lugar)
                </p>
              </div>
            </label>
          </div>

          <!-- Datos de tarjeta (maqueta) -->
          <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
            <label class="flex flex-col min-w-40 flex-1">
              <p class="text-[#111318] text-base font-medium leading-normal pb-2">
                Número de tarjeta
              </p>
              <input
                placeholder="Introduce el número de tarjeta"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border-none bg-[#f0f2f4] focus:border-none h-14 placeholder:text-[#616f89] p-4 text-base font-normal leading-normal"
                value=""
              />
            </label>
          </div>
          <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-1">
            <label class="flex flex-col min-w-40 flex-1">
              <p class="text-[#111318] text-base font-medium leading-normal pb-2">
                Fecha de vencimiento
              </p>
              <input
                placeholder="MM/AA"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border-none bg-[#f0f2f4] focus:border-none h-14 placeholder:text-[#616f89] p-4 text-base font-normal leading-normal"
                value=""
              />
            </label>
            <label class="flex flex-col min-w-40 flex-1">
              <p class="text-[#111318] text-base font-medium leading-normal pb-2">
                CVV
              </p>
              <input
                placeholder="CVV"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border-none bg-[#f0f2f4] focus:border-none h-14 placeholder:text-[#616f89] p-4 text-base font-normal leading-normal"
                value=""
              />
            </label>
          </div>

          <!-- Resumen de precios -->
          <h2
            class="text-[#111318] text-[20px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5"
          >
            Resumen de precios
          </h2>
          <div class="p-4 bg-white rounded-lg shadow-sm mx-4">
            <div class="flex justify-between gap-x-6 py-2">
              <p class="text-[#616f89] text-sm font-normal leading-normal">
                2 noches
              </p>
              <p class="text-[#111318] text-sm font-normal leading-normal text-right">
                $200
              </p>
            </div>
            <div class="flex justify-between gap-x-6 py-2">
              <p class="text-[#616f89] text-sm font-normal leading-normal">
                Comisión del servicio
              </p>
              <p class="text-[#111318] text-sm font-normal leading-normal text-right">
                $20
              </p>
            </div>
            <div class="flex justify-between gap-x-6 py-2">
              <p class="text-[#616f89] text-sm font-normal leading-normal">
                Impuestos
              </p>
              <p class="text-[#111318] text-sm font-normal leading-normal text-right">
                $10
              </p>
            </div>
            <div class="flex justify-between gap-x-6 py-2 border-t border-t-[#e1e4ea] mt-2 pt-3">
              <p class="text-[#616f89] text-sm font-medium leading-normal">
                Total
              </p>
              <p class="text-[#111318] text-sm font-semibold leading-normal text-right">
                $230
              </p>
            </div>
          </div>

          <!-- Botón pagar -->
          <div class="flex px-4 py-4">
            <a
              href="../confirmacion_reserva/code.html"
              class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-[#f4c652] text-[#111318] text-base font-bold leading-normal tracking-[0.015em]"
            >
              <span class="truncate">Confirmar pago</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
